<!-- @ajan: cursor · @etiket: katman-2, oa-search, search-kind, field-active -->
<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="utf-8" />
    <title>OA Arama</title>
    <style type="text/css">
      <![CDATA[
            :root {
              --oa-bg: #f7f7f8;
              --oa-fg: #1c1c1e;
              --oa-muted: #6b6b70;
              --oa-card: #ffffff;
              --oa-border: #e4e4e7;
              --oa-accent: #0f766e;
              --oa-accent-fg: #fff;
              --oa-warn: #b45309;
              --oa-row-sel: rgba(15, 118, 110, 0.12);
            }

            @media (prefers-color-scheme: dark) {
              :root {
                --oa-bg: #1c1c1e;
                --oa-fg: #f2f2f3;
                --oa-muted: #a0a0a6;
                --oa-card: #2a2a2e;
                --oa-border: #3a3a40;
                --oa-row-sel: rgba(45, 212, 191, 0.15);
              }
            }

            html, body {
              margin: 0;
              padding: 0;
              height: 100%;
              background: var(--oa-bg);
              color: var(--oa-fg);
              font: 13px/1.4 system-ui, Segoe UI, sans-serif;
            }

            #zpdfmanager-oa-shell {
              height: 100%;
              box-sizing: border-box;
              display: flex;
              flex-direction: column;
              padding: 14px 16px;
              gap: 10px;
            }

            h1 {
              margin: 0;
              font-size: 16px;
              font-weight: 650;
            }

            .target {
              padding: 8px 10px;
              border-radius: 8px;
              border: 1px solid var(--oa-border);
              background: var(--oa-card);
              color: var(--oa-muted);
            }

            .target.has-item {
              color: var(--oa-fg);
            }

            .search-grid {
              display: grid;
              grid-template-columns: repeat(4, minmax(0, 1fr)) auto;
              gap: 8px;
              align-items: end;
            }

            .search-grid .oa-field[hidden] {
              display: none !important;
            }

            .kind-row {
              display: flex;
              align-items: end;
              gap: 10px;
              flex-wrap: wrap;
            }

            .kind-row label {
              min-width: 160px;
            }

            .kind-row select {
              min-width: 180px;
            }

            .oa-field-head {
              display: flex;
              align-items: center;
              gap: 6px;
              flex-direction: row;
            }

            .oa-field-head input[type="checkbox"] {
              margin: 0;
              flex: 0 0 auto;
            }

            .oa-field-by-field {
              flex-direction: row;
              align-items: center;
              gap: 6px;
              min-width: auto !important;
              color: var(--oa-fg);
              font-size: 12px;
              cursor: pointer;
              user-select: none;
            }

            .oa-field-by-field input {
              margin: 0;
            }

            .oa-field.inactive-field input[type="text"] {
              opacity: 0.45;
            }

            @media (max-width: 900px) {
              .search-grid {
                grid-template-columns: 1fr 1fr;
              }
            }

            label {
              display: flex;
              flex-direction: column;
              gap: 4px;
              font-size: 11px;
              color: var(--oa-muted);
            }

            input[type="text"] {
              border: 1px solid var(--oa-border);
              border-radius: 6px;
              padding: 7px 9px;
              font: inherit;
              background: var(--oa-card);
              color: var(--oa-fg);
            }

            button {
              border: none;
              border-radius: 8px;
              padding: 8px 12px;
              cursor: pointer;
              font: inherit;
              background: var(--oa-accent);
              color: var(--oa-accent-fg);
            }

            button:disabled {
              opacity: 0.45;
              cursor: default;
            }

            button.busy {
              opacity: 0.9;
              cursor: progress;
            }

            .actions {
              display: flex;
              flex-wrap: wrap;
              gap: 8px;
              align-items: center;
            }

            .filter-check {
              display: flex;
              flex-direction: row;
              align-items: center;
              gap: 6px;
              margin-left: auto;
              font-size: 12px;
              color: var(--oa-fg);
              cursor: pointer;
              user-select: none;
            }

            .filter-check input {
              margin: 0;
            }

            .sources-row {
              border: 1px solid var(--oa-border);
              border-radius: 8px;
              background: var(--oa-card);
              padding: 8px 10px;
              display: flex;
              flex-direction: column;
              gap: 6px;
            }

            .sources-head {
              display: flex;
              flex-wrap: wrap;
              align-items: center;
              gap: 8px;
              font-size: 11px;
              color: var(--oa-muted);
            }

            .sources-head .spacer {
              flex: 1;
            }

            button.linkish {
              background: transparent;
              color: var(--oa-accent);
              padding: 2px 6px;
              border-radius: 4px;
              font-size: 11px;
            }

            button.linkish:hover {
              background: var(--oa-row-sel);
            }

            .sources {
              display: flex;
              flex-wrap: wrap;
              gap: 6px 10px;
            }

            .sources label {
              flex-direction: row;
              align-items: center;
              gap: 5px;
              font-size: 12px;
              color: var(--oa-fg);
              cursor: pointer;
              user-select: none;
            }

            .sources input {
              margin: 0;
            }

            .table-wrap {
              flex: 1;
              min-height: 0;
              overflow: auto;
              border: 1px solid var(--oa-border);
              border-radius: 8px;
              background: var(--oa-card);
            }

            table {
              width: 100%;
              border-collapse: collapse;
            }

            th, td {
              padding: 7px 8px;
              border-bottom: 1px solid var(--oa-border);
              text-align: left;
              vertical-align: top;
            }

            th {
              position: sticky;
              top: 0;
              background: var(--oa-card);
              font-size: 11px;
              color: var(--oa-muted);
              font-weight: 600;
              z-index: 1;
            }

            tr.selected td {
              background: var(--oa-row-sel);
            }

            tr.clickable {
              cursor: pointer;
            }

            tr.clickable:focus {
              outline: 2px solid var(--oa-accent);
              outline-offset: -2px;
            }

            .hit-title { font-weight: 560; }
            .hit-meta { font-size: 11px; margin-top: 2px; word-break: break-all; }

            .num { text-align: right; white-space: nowrap; }
            .ok { color: #15803d; font-weight: 600; }
            .muted { color: var(--oa-muted); }

            #zpdfmanager-oa-status {
              color: var(--oa-muted);
              font-size: 12px;
              min-height: 1.2em;
            }

            #zpdfmanager-oa-status.error {
              color: var(--oa-warn);
            }

            #zpdfmanager-oa-dl-jobs {
              margin-top: 6px;
              display: flex;
              flex-direction: column;
              gap: 2px;
              font-size: 11px;
              color: var(--oa-muted);
              font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
              max-height: 6.5em;
              overflow: auto;
            }

            #zpdfmanager-oa-dl-jobs[hidden] {
              display: none !important;
            }

            #zpdfmanager-oa-dl-jobs .oa-dl-job {
              white-space: nowrap;
              overflow: hidden;
              text-overflow: ellipsis;
            }
          ]]>
    </style>
  </head>
  <body>
    <div id="zpdfmanager-oa-shell">
      <h1 id="zpdfmanager-oa-title">OA Arama</h1>
      <div id="zpdfmanager-oa-target" class="target"></div>
      <div class="kind-row">
        <label
          >Tür
          <select id="zpdfmanager-oa-kind">
            <option value="book">Kitap</option>
            <option value="journalArticle" selected="selected">
              Dergi makalesi
            </option>
            <option value="bookSection">Kitap bölümü</option>
            <option value="thesis">Tez</option>
          </select>
        </label>
        <label
          class="oa-field-by-field"
          id="zpdfmanager-oa-field-by-field-label"
          ><input id="zpdfmanager-oa-field-by-field" type="checkbox" />Tek tek
          alan ara</label
        >
      </div>
      <div class="search-grid">
        <label class="oa-field" data-field="title"
          ><span class="oa-field-head"
            ><input
              class="oa-field-active"
              data-field="title"
              type="checkbox"
              checked="checked"
            /><span class="oa-field-label">Başlık</span></span
          >
          <input id="zpdfmanager-oa-q" type="text" autocomplete="off"
        /></label>
        <label class="oa-field" data-field="authors"
          ><span class="oa-field-head"
            ><input
              class="oa-field-active"
              data-field="authors"
              type="checkbox"
              checked="checked"
            /><span class="oa-field-label">Yazarlar</span></span
          >
          <input id="zpdfmanager-oa-authors" type="text" autocomplete="off"
        /></label>
        <label class="oa-field" data-field="doi" hidden="hidden"
          ><span class="oa-field-head"
            ><input
              class="oa-field-active"
              data-field="doi"
              type="checkbox"
              checked="checked"
            /><span class="oa-field-label">DOI</span></span
          >
          <input id="zpdfmanager-oa-doi" type="text" autocomplete="off"
        /></label>
        <label class="oa-field" data-field="isbn" hidden="hidden"
          ><span class="oa-field-head"
            ><input
              class="oa-field-active"
              data-field="isbn"
              type="checkbox"
              checked="checked"
            /><span class="oa-field-label">ISBN</span></span
          >
          <input id="zpdfmanager-oa-isbn" type="text" autocomplete="off"
        /></label>
        <label class="oa-field" data-field="year" hidden="hidden"
          ><span class="oa-field-head"
            ><input
              class="oa-field-active"
              data-field="year"
              type="checkbox"
              checked="checked"
            /><span class="oa-field-label">Yıl</span></span
          >
          <input id="zpdfmanager-oa-year" type="text" autocomplete="off"
        /></label>
        <label class="oa-field" data-field="language" hidden="hidden"
          ><span class="oa-field-head"
            ><input
              class="oa-field-active"
              data-field="language"
              type="checkbox"
              checked="checked"
            /><span class="oa-field-label">Dil</span></span
          >
          <input id="zpdfmanager-oa-language" type="text" autocomplete="off"
        /></label>
        <label class="oa-field" data-field="translator" hidden="hidden"
          ><span class="oa-field-head"
            ><input
              class="oa-field-active"
              data-field="translator"
              type="checkbox"
              checked="checked"
            /><span class="oa-field-label">Çevirmen</span></span
          >
          <input id="zpdfmanager-oa-translator" type="text" autocomplete="off"
        /></label>
        <label class="oa-field" data-field="publication" hidden="hidden"
          ><span class="oa-field-head"
            ><input
              class="oa-field-active"
              data-field="publication"
              type="checkbox"
              checked="checked"
            /><span class="oa-field-label">Yayın / dergi</span></span
          >
          <input id="zpdfmanager-oa-publication" type="text" autocomplete="off"
        /></label>
        <label class="oa-field" data-field="editors" hidden="hidden"
          ><span class="oa-field-head"
            ><input
              class="oa-field-active"
              data-field="editors"
              type="checkbox"
              checked="checked"
            /><span class="oa-field-label">Editörler</span></span
          >
          <input id="zpdfmanager-oa-editors" type="text" autocomplete="off"
        /></label>
        <label class="oa-field" data-field="bookTitle" hidden="hidden"
          ><span class="oa-field-head"
            ><input
              class="oa-field-active"
              data-field="bookTitle"
              type="checkbox"
              checked="checked"
            /><span class="oa-field-label">Kitap başlığı</span></span
          >
          <input id="zpdfmanager-oa-book-title" type="text" autocomplete="off"
        /></label>
        <label class="oa-field" data-field="publisher" hidden="hidden"
          ><span class="oa-field-head"
            ><input
              class="oa-field-active"
              data-field="publisher"
              type="checkbox"
              checked="checked"
            /><span class="oa-field-label">Yayıncı</span></span
          >
          <input id="zpdfmanager-oa-publisher" type="text" autocomplete="off"
        /></label>
        <label class="oa-field" data-field="thesisType" hidden="hidden"
          ><span class="oa-field-head"
            ><input
              class="oa-field-active"
              data-field="thesisType"
              type="checkbox"
              checked="checked"
            /><span class="oa-field-label">Tez türü</span></span
          >
          <input id="zpdfmanager-oa-thesis-type" type="text" autocomplete="off"
        /></label>
        <label class="oa-field" data-field="university" hidden="hidden"
          ><span class="oa-field-head"
            ><input
              class="oa-field-active"
              data-field="university"
              type="checkbox"
              checked="checked"
            /><span class="oa-field-label">Üniversite</span></span
          >
          <input id="zpdfmanager-oa-university" type="text" autocomplete="off"
        /></label>
        <button id="zpdfmanager-oa-search" type="button" data-label="Ara">
          Ara
        </button>
      </div>
      <div class="sources-row">
        <div class="sources-head">
          <span id="zpdfmanager-oa-sources-label">Kaynaklar</span>
          <span class="spacer"></span>
          <button
            id="zpdfmanager-oa-sources-all"
            type="button"
            class="linkish"
            data-label="Tümü"
          >
            Tümü
          </button>
          <button
            id="zpdfmanager-oa-sources-none"
            type="button"
            class="linkish"
            data-label="Hiçbiri"
          >
            Hiçbiri
          </button>
        </div>
        <div id="zpdfmanager-oa-sources" class="sources"></div>
      </div>
      <div class="actions">
        <button
          id="zpdfmanager-oa-attach"
          type="button"
          disabled="disabled"
          data-label="Seçiliye ekle"
        >
          Seçiliye ekle
        </button>
        <button
          id="zpdfmanager-oa-create"
          type="button"
          disabled="disabled"
          data-label="Yeni öğe + PDF"
        >
          Yeni öğe + PDF
        </button>
        <button
          id="zpdfmanager-oa-related"
          type="button"
          disabled="disabled"
          data-label="Seçiliye ekle + Related"
        >
          Seçiliye ekle + Related
        </button>
        <label class="filter-check"
          ><input
            id="zpdfmanager-oa-pdf-only"
            type="checkbox"
            checked="checked"
          />
          <span id="zpdfmanager-oa-pdf-only-label">Yalnızca PDF</span></label
        >
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th class="num">Skor</th>
              <th>Kaynak</th>
              <th>Başlık</th>
              <th>Yıl</th>
              <th>PDF?</th>
              <th>Yazar</th>
            </tr>
          </thead>
          <tbody id="zpdfmanager-oa-tbody"></tbody>
        </table>
      </div>
      <div id="zpdfmanager-oa-status"></div>
      <div id="zpdfmanager-oa-dl-jobs" hidden="hidden"></div>
    </div>
  </body>
</html>
